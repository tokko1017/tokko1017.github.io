<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アラト出版</title>
<meta name="description" content="アラト出版が出版している著書の紹介ページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <!-- 紙の本＋花瓶（線画風イラスト） -->
      <svg class="shelf-icon" viewBox="0 0 180 150" aria-hidden="true">
        <path d="M20,108 Q13,128 22,139 Q30,148 39,139 Q47,128 40,108 Z" fill="#faf6ea" stroke="#5b4636" stroke-width="1.6"/>
        <path d="M29,108 C27,93 35,84 31,68" fill="none" stroke="#8a9a72" stroke-width="1.4" stroke-linecap="round"/>
        <ellipse cx="31" cy="66" rx="5" ry="4" fill="#e3b7ad" stroke="#5b4636" stroke-width="0.8"/>
        <path d="M34,108 C37,97 31,89 35,77" fill="none" stroke="#8a9a72" stroke-width="1.2" stroke-linecap="round"/>
        <g stroke="#5b4636" stroke-width="1.6" stroke-linejoin="round">
          <path d="M56,52 h20 v88 h-20 Z" fill="#f3ead9"/>
          <path d="M76,42 h18 v98 h-18 Z" fill="#eee5d2"/>
          <path d="M94,56 h18 v84 h-18 Z" fill="#f3ead9"/>
          <path d="M112,38 h20 v102 h-20 Z" fill="#eee5d2"/>
        </g>
        <line x1="56" y1="96" x2="132" y2="96" stroke="#c9a227" stroke-width="1.2"/>
        <circle cx="66" cy="96" r="5" fill="#d9c6b0" stroke="#5b4636" stroke-width="0.8"/>
        <circle cx="85" cy="96" r="5" fill="#e3b7ad" stroke="#5b4636" stroke-width="0.8"/>
        <circle cx="103" cy="96" r="5" fill="#b9c6ab" stroke="#5b4636" stroke-width="0.8"/>
        <circle cx="122" cy="96" r="5" fill="#d9c6b0" stroke="#5b4636" stroke-width="0.8"/>
      </svg>
      <div class="header-text">
        <h1 id="site-title">アラト出版</h1>
        <p id="intro-text" class="intro-text"></p>
      </div>
      <!-- 電子書籍リーダー（線画風イラスト） -->
      <svg class="shelf-icon" viewBox="0 0 140 170" aria-hidden="true">
        <rect x="10" y="8" width="120" height="152" rx="16" fill="#f3ead9" stroke="#5b4636" stroke-width="2"/>
        <rect x="24" y="22" width="92" height="108" rx="4" fill="#faf6ea" stroke="#5b4636" stroke-width="1.2"/>
        <text x="70" y="42" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#5b4636" text-anchor="middle">eBook</text>
        <g stroke="#a89a80" stroke-width="1.2" stroke-linecap="round">
          <line x1="32" y1="54" x2="108" y2="54"/>
          <line x1="32" y1="64" x2="108" y2="64"/>
          <line x1="32" y1="74" x2="108" y2="74"/>
          <line x1="32" y1="84" x2="88" y2="84"/>
          <line x1="32" y1="94" x2="108" y2="94"/>
          <line x1="32" y1="104" x2="98" y2="104"/>
        </g>
        <ellipse cx="98" cy="118" rx="6" ry="5" fill="#e3b7ad" stroke="#5b4636" stroke-width="0.8"/>
        <circle cx="70" cy="146" r="7" fill="none" stroke="#5b4636" stroke-width="1.4"/>
      </svg>
    </div>
  </header>

  <main class="wrap">
    <div id="book-sections"><!-- JSで自動生成されます --></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="footer-year"></span> <span id="footer-publisher"></span></p>
    </div>
  </footer>

  <!-- 本のデータ（本を追加するときはこのファイルだけ編集） -->
  <script src="js/books-data.js"></script>
  <!-- 表示ロジック（通常は編集不要） -->
  <script src="js/main.js"></script>
</body>
</html>
