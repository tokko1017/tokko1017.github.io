<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アラト出版</title>
<meta name="description" content="アラト出版が出版している著書の紹介ページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <!-- バナー画像（社長デザイン差し替え用）。images/banner.jpg を差し替えるだけでOK -->
    <img class="banner-image" src="images/banner.jpg" alt="アラト出版 ― Kindleで出版している本を紹介しています" width="1600" height="300">
    <!-- タイトル文字は画像に含まれているため画面上は非表示。SEO/読み上げ用に保持 -->
    <h1 id="site-title" class="sr-only">アラト出版</h1>
    <p id="intro-text" class="intro-text sr-only"></p>
  </header>

  <main class="wrap">
    <div id="book-sections"><!-- JSで自動生成されます --></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="footer-year"></span> <span id="footer-publisher"></span></p>
    </div>
  </footer>

  <!-- 本のデータ（本を追加するときはこのファイルだけ編集） -->
  <script src="js/books-data.js"></script>
  <!-- 表示ロジック（通常は編集不要） -->
  <script src="js/main.js"></script>
</body>
</html>
